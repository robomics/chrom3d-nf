name: Build hictkpy Dockerfile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-hictkpy*dockerfile.yml"
      - ".github/workflows/build-dockerfile.yml"
      - "containers/hictkpy*.Dockerfile"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-hictkpy*dockerfile.yml"
      - ".github/workflows/build-dockerfile.yml"
      - "containers/hictkpy*.Dockerfile"

jobs:
  build-hictkpy-dockerfile:
    name: Build hictkpy Dockerfile
    uses: robomics/chrom3d-nf/.github/workflows/build-dockerfile.yml@daa0016a57f2dc25247d5fbf306025f91b32a1d7
    with:
      dockerfile-glob: "containers/hictkpy*.Dockerfile"

    permissions:
      contents: read
      packages: write
