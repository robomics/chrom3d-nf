name: Build utils Dockerfile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-utils*dockerfile.yml"
      - ".github/workflows/build-dockerfile.yml"
      - "containers/utils*.Dockerfile"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-utils*dockerfile.yml"
      - ".github/workflows/build-dockerfile.yml"
      - "containers/utils*.Dockerfile"

jobs:
  build-utils-dockerfile:
    name: Build utils Dockerfile
    uses: robomics/chrom3d-nf/.github/workflows/build-dockerfile.yml@daa0016a57f2dc25247d5fbf306025f91b32a1d7
    with:
      dockerfile-glob: "containers/utils*.Dockerfile"

    permissions:
      contents: read
      packages: write
