name: CI

on:
  push:
    branches: [main, devel]
    paths:
      - ".github/workflows/ci.yml"
      - "main.nf"
      - "nextflow.config"
      - "bin/*.py"
      - "conf/base.config"
      - "conf/ci.config"
      - "subworkflows/**"
      - "test/samplesheets/*.tsv"

  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "main.nf"
      - "nextflow.config"
      - "bin/*.py"
      - "conf/base.config"
      - "conf/ci.config"
      - "subworkflows/**"
      - "test/samplesheets/*.tsv"

  release:
    types: [published]

# https://stackoverflow.com/a/72408109
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  preproc-test-dataset:
    name: Preprocess test dataset
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.generate-cache-key.outputs.key }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate cache key
        id: generate-cache-key
        run: |
          key='test-dataset-${{ hashFiles('utils/download_example_datasets.sh') }}'
          echo "key=$key" >> $GITHUB_OUTPUT

      - name: Lookup cached test datasets
        id: cache-dataset
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.generate-cache-key.outputs.key }}
          path: test/data/
          lookup-only: true

      - name: Download test dataset
        if: steps.cache-dataset.outputs.cache-hit != 'true'
        run: utils/download_example_datasets.sh test/data/

      - name: Cache test datasets
        if: steps.cache-dataset.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.generate-cache-key.outputs.key }}
          path: test/data/

  test-workflow:
    name: Test workflow
    runs-on: ubuntu-latest
    needs: [preproc-test-dataset]

    permissions:
      contents: read
      packages: read

    strategy:
      matrix:
        NXF_VER: ["25.04", "latest-stable"]

    env:
      HICTK_NO_TELEMETRY: "1"
      NCHG_NO_TELEMETRY: "1"
      NXF_ANSI_LOG: false
      NXF_SYNTAX_PARSER: "v2"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache test datasets
        uses: actions/cache@v4
        with:
          key: ${{ needs.preproc-test-dataset.outputs.cache-key }}
          path: test/data/
          fail-on-cache-miss: true

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.NXF_VER }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test workflow (wo/ samplesheet)
        run: |
          nextflow run -c conf/ci.config \
                       --sample example \
                       --hic_file test/data/4DNFIZ1ZVXC8.mcool \
                       --resolution 500000 \
                       --number_of_models $(nproc) \
                       -output-dir wo_samplesheet \
                       .

          tree wo_samplesheet

      - name: Test workflow (w/ samplesheet; single sample)
        run: |
          nextflow run -c conf/ci.config \
                       --sample_sheet=test/samplesheets/single_sample.tsv \
                       --number_of_models $(nproc) \
                       -output-dir single_sample \
                       .

          tree single_sample

      - name: Test workflow (w/ samplesheet; multiple_samples)
        run: |
          nextflow run -c conf/ci.config \
                       --sample_sheet=test/samplesheets/multiple_samples.tsv \
                       --number_of_models 1 \
                       -output-dir multiple_samples \
                       .

          tree multiple_samples
